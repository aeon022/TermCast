<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>termcast — zsh (demo)</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, system-ui, sans-serif;
      background: linear-gradient(135deg, #ff007f 0%, #00f0ff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .termcast-card {
      width: 100%;
      max-width: 800px;
      background: #282a36;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .termcast-header {
      background: #21222c;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0,0,0,0.2);
    }
    .termcast-dots {
      display: flex;
      gap: 8px;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #FF5F56; }
    .dot.yellow { background: #FFBD2E; }
    .dot.green { background: #27C93F; }
    .termcast-title {
      color: #f8f8f2;
      opacity: 0.8;
      font-size: 13px;
      font-weight: 600;
    }
    .termcast-copy {
      background: rgba(255,255,255,0.1);
      color: #f8f8f2;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .termcast-copy:hover { background: rgba(255,255,255,0.25); }
    .termcast-body {
      padding: 20px;
      font-family: Menlo, Monaco, 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.5;
      overflow-x: auto;
      color: #f8f8f2;
    }
    .line { display: flex; }
    .ln {
      width: 32px;
      color: rgba(255,255,255,0.25);
      user-select: none;
      text-align: right;
      padding-right: 16px;
      font-size: 12px;
    }
    .lc { flex: 1; white-space: pre; }
    .footer {
      text-align: center;
      padding: 10px;
      font-size: 11px;
      color: rgba(255,255,255,0.5);
    }
    .footer a { color: #0066FF; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="termcast-card">
  <div class="termcast-header">
    <div class="termcast-dots">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="termcast-title">termcast — zsh (demo)</div>
    <button class="termcast-copy" onclick="copyCode()">Copy</button>
  </div>
  <div class="termcast-body">
<div class="line"><span class="ln">1</span><span class="lc"><span style="color: #50fa7b; ">✔</span><span style="color: #f8f8f2; "> </span><span style="color: #f8f8f2; font-weight: bold;">JoplinBridge</span><span style="color: #f8f8f2; "> initialized successfully</span></span></div>
<div class="line"><span class="ln">2</span><span class="lc"><span style="color: #8be9fd; ">ℹ</span><span style="color: #f8f8f2; "> Watching local directory: </span><span style="color: #bd93f9; ">/Users/gweiher/Projects/docs</span></span></div>
<div class="line"><span class="ln">3</span><span class="lc"><span style="color: #f1fa8c; ">⚡</span><span style="color: #f8f8f2; "> Synced </span><span style="color: #f8f8f2; font-weight: bold;">184 notes</span><span style="color: #f8f8f2; "> in 42ms (0 errors)</span></span></div>
<div class="line"><span class="ln">4</span><span class="lc"><span style="color: #50fa7b; ">✔</span><span style="color: #f8f8f2; "> Output saved to </span><span style="color: #ff79c6; ">termcast-demo.svg</span></span></div>
  </div>
  <div class="footer">Crafted with <a href="https://github.com/aeon022/TermCast" target="_blank">TermCast</a></div>
</div>

<script>
  function copyCode() {
    const raw = "✔ JoplinBridge initialized successfully\nℹ Watching local directory: /Users/gweiher/Projects/docs\n⚡ Synced 184 notes in 42ms (0 errors)\n✔ Output saved to termcast-demo.svg";
    navigator.clipboard.writeText(raw).then(() => {
      const btn = document.querySelector('.termcast-copy');
      btn.innerText = '✓ Copied!';
      setTimeout(() => btn.innerText = 'Copy', 2000);
    });
  }
</script>

</body>
</html>
